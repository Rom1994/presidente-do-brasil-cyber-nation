
name: Cyber Nation - APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Extrair ZIP e exportar APK de teste
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar e extrair ZIP do projeto
        shell: bash
        run: |
          set -euxo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo 'Nenhum arquivo ZIP encontrado na raiz do repositório.'
            exit 1
          fi
          cp "$ZIP_FILE" /tmp/cyber-nation-project.zip
          rm -f "$ZIP_FILE"
          mkdir -p extracted
          unzip -q /tmp/cyber-nation-project.zip -d extracted
          PROJECT_FILE="$(find extracted -mindepth 2 -maxdepth 5 -type f -name project.godot | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo 'Não encontrei project.godot dentro do ZIP.'
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          rsync -a "$PROJECT_DIR/" ./ --exclude='.git/'
          test -f project.godot
          test -f export_presets.cfg

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Baixar Godot 4.3 e templates Android
        run: |
          set -euxo pipefail
          URL="https://github.com/godotengine/godot/releases/download/4.3-stable"
          curl -fL "$URL/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin
          sudo install -m 755 godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot

          curl -fL "$URL/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz
          mkdir templates-unpacked
          unzip -q templates.tpz -d templates-unpacked
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"
          find templates-unpacked -type f \
            \( -name 'android_debug.apk' -o -name 'android_release.apk' \) \
            -exec cp {} "$DEST/" \;
          printf '4.3.stable' > "$DEST/version.txt"
          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"

      - name: Configurar caminhos do Android no Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2

      - name: Validar e importar projeto
        run: godot --headless --editor --path . --import

      - name: Gerar APK de teste
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/CyberNation-debug.apk
          test -s build/CyberNation-debug.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: CyberNation-Android-APK
          path: build/CyberNation-debug.apk
          if-no-files-found: error
          retention-days: 14
