
name: Cyber Nation - APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto Godot
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP não encontrado."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE="$(find extracted -mindepth 2 -maxdepth 6 -type f -name project.godot | head -n 1)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: project.godot não encontrado."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          rsync -a "$PROJECT_DIR/" ./ --exclude='.git/'

          test -f project.godot
          test -f export_presets.cfg

          rm -rf extracted

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euxo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("project.godot")
          content = path.read_text()
          key = "textures/vram_compression/import_etc2_astc"

          if re.search(r"(?m)^" + re.escape(key) + r"\s*=", content):
              content = re.sub(
                  r"(?m)^" + re.escape(key) + r"\s*=.*$",
                  key + "=true",
                  content
              )
          elif re.search(r"(?m)^\[rendering\]\s*$", content):
              content = re.sub(
                  r"(?m)^\[rendering\]\s*$",
                  "[rendering]\n" + key + "=true",
                  content,
                  count=1
              )
          else:
              content += "\n[rendering]\n" + key + "=true\n"

          path.write_text(content)
          print("ETC2/ASTC ativado.")
          PY

          rm -rf .godot

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi

          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

          test -f "$SDK_ROOT/platform-tools/adb"
          test -f "$SDK_ROOT/platforms/android-34/android.jar"
          test -f "$SDK_ROOT/build-tools/34.0.0/apksigner"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Baixar Godot 4.3 e templates
        shell: bash
        run: |
          set -euxo pipefail

          URL="https://github.com/godotengine/godot/releases/download/4.3-stable"

          curl -fL "$URL/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d godot-bin

          sudo install -m 755 \
            godot-bin/Godot_v4.3-stable_linux.x86_64 \
            /usr/local/bin/godot

          curl -fL "$URL/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz

          mkdir templates-unpacked
          unzip -q templates.tpz -d templates-unpacked

          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST"

          find templates-unpacked -type f \
            \( -name 'android_debug.apk' -o -name 'android_release.apk' \) \
            -exec cp {} "$DEST/" \;

          printf '4.3.stable' > "$DEST/version.txt"

          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"

      - name: Criar chave de assinatura
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configurar Godot e preset Android
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("export_presets.cfg")
          content = path.read_text()

          if '[preset.0.options]' not in content:
              raise SystemExit("Preset Android não encontrado.")

          values = {
              "keystore/debug": str(Path.home() / ".android/debug.keystore"),
              "keystore/debug_user": "androiddebugkey",
              "keystore/debug_password": "android",
          }

          for key, value in values.items():
              line = f'{key}="{value}"'
              pattern = r"(?m)^" + re.escape(key) + r"=.*$"

              if re.search(pattern, content):
                  content = re.sub(pattern, lambda _: line, content)
              else:
                  content = content.replace(
                      "[preset.0.options]",
                      "[preset.0.options]\n" + line,
                      1
                  )

          path.write_text(content)
          print("Preset Android configurado.")
          PY

      - name: Validar e importar projeto
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --editor --path . --import

      - name: Validar preset Android
        shell: bash
        run: |
          set -euxo pipefail

          grep -q 'name="Android"' export_presets.cfg
          grep -q 'architectures/arm64-v8a=true' export_presets.cfg
          grep -q 'keystore/debug=' export_presets.cfg
          grep -q 'keystore/debug_user="androiddebugkey"' export_presets.cfg
          grep -q 'keystore/debug_password="android"' export_presets.cfg

          test -s "$HOME/.android/debug.keystore"

          echo "Preset Android validado."

      - name: Gerar APK de teste
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p build

          godot --headless --verbose --path . \
            --export-debug "Android" \
            build/CyberNation-debug.apk

          test -s build/CyberNation-debug.apk

          ls -lh build/CyberNation-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberNation-Android-APK
          path: build/CyberNation-debug.apk
          if-no-files-found: error
          retention-days: 14
